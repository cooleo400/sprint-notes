<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for build/icon.png and build/icon.icns; regenerate with `npm run icon`.
       Layout follows the macOS app icon grid: an 824px rounded square centred on a 1024px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb0ff"/>
      <stop offset="1" stop-color="#2557d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="page-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b2a6b" flood-opacity=".35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g clip-path="url(#tile)">
  <!-- shifted left so the stack, not just the front page, is centred -->
  <g transform="translate(-26 0)">
    <!-- archived sprints -->
    <rect x="322" y="236" width="440" height="548" rx="44" fill="#fff" opacity=".28" transform="rotate(9 542 510)"/>
    <rect x="302" y="246" width="440" height="548" rx="44" fill="#fff" opacity=".5" transform="rotate(4.5 522 520)"/>

    <!-- current sprint -->
    <g filter="url(#page-shadow)">
      <rect x="282" y="256" width="440" height="548" rx="44" fill="#fff"/>
    </g>
    <rect x="282" y="256" width="440" height="96" rx="44" fill="#e8f1ff"/>
    <rect x="282" y="308" width="440" height="44" fill="#e8f1ff"/>
    <rect x="334" y="292" width="150" height="24" rx="12" fill="#2f6fe8" opacity=".85"/>

    <g transform="translate(0 18)">
    <!-- done -->
    <rect x="334" y="400" width="68" height="68" rx="16" fill="#2f6fe8"/>
    <path d="M351 435 l14 14 l22 -27" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="421" width="230" height="26" rx="13" fill="#d7e0ee"/>

    <rect x="334" y="510" width="68" height="68" rx="16" fill="#2f6fe8"/>
    <path d="M351 545 l14 14 l22 -27" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="531" width="190" height="26" rx="13" fill="#d7e0ee"/>

    <!-- open -->
    <rect x="338" y="624" width="60" height="60" rx="14" fill="none" stroke="#9fb3d1" stroke-width="8"/>
    <rect x="430" y="641" width="214" height="26" rx="13" fill="#8a9cb8"/>
    </g>
  </g>
  </g>
</svg>
